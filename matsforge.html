<title>Mat's Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root {
  --bg-page:   #f2efe8;
  --bg-card:   #ffffff;
  --bg-raised: #f8f6f1;
  --bg-input:  #ffffff;
  --bg-muted:  #ece9e0;
  --text:      #1a1a1a;
  --text-2:    #4a4a4a;
  --text-3:    #888888;
  --accent:    #2c3e50;
  --accent-2:  #3d566e;
  --gold:      #c9aa71;
  --red:       #c0392b;
  --green:     #27ae60;
  --border:    rgba(0,0,0,0.10);
  --border-2:  rgba(0,0,0,0.18);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
  --shadow:    0 3px 12px rgba(0,0,0,0.10);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.18);
  --r:         6px;
  --gap:       5px;
  --safe-b:    env(safe-area-inset-bottom, 0px);
  --safe-t:    env(safe-area-inset-top, 0px);
  --btn-h:     34px;
  --fs-label:  9px;
  --fs-value:  30px;
  --fs-text:   14px;
  --field-pad: 8px;
}

[data-theme="dark"] {
  --bg-page:   #161a1f;
  --bg-card:   #1e2530;
  --bg-raised: #242b38;
  --bg-input:  #1a2030;
  --bg-muted:  #1a2028;
  --text:      #e8e4d8;
  --text-2:    #a09880;
  --text-3:    #585e6a;
  --accent:    #7eb8e2;
  --accent-2:  #9fcaec;
  --gold:      #c9aa71;
  --red:       #e05040;
  --green:     #3ab870;
  --border:    rgba(255,255,255,0.08);
  --border-2:  rgba(255,255,255,0.16);
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
  --shadow:    0 3px 12px rgba(0,0,0,0.45);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
}

/* Responsive scaling */
@media (min-width: 600px) {
  :root { --fs-label:10px; --fs-value:34px; --fs-text:15px; --btn-h:36px; --field-pad:10px; --gap:6px; }
}
@media (min-width: 1025px) {
  :root { --fs-label:11px; --fs-value:38px; --fs-text:16px; --btn-h:40px; --field-pad:12px; --gap:8px; }
  .main { max-width: 1100px; padding: 16px; padding-bottom: 40px; }
  .panel { padding: 18px; margin-bottom: 18px; border-radius: 10px; }
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  background: var(--bg-page); color: var(--text);
  font-family: 'Lora', Georgia, serif; line-height: 1.4;
  min-height: 100dvh; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden; overscroll-behavior-y: none;
}
button, input, textarea, select { font-family: inherit; }
button { cursor: pointer; border: none; background: none; }

/* ── TOPBAR ── */
.topbar {
  position: sticky; top: 0; z-index: 90;
  background: var(--bg-card); border-bottom: 1px solid var(--border-2);
  padding: 8px 12px;
  padding-top: max(8px, calc(var(--safe-t) + 4px));
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow);
}
.topbar-logo {
  font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700;
  color: var(--accent); letter-spacing: 0.5px; white-space: nowrap;
  flex-shrink: 0;
}
.topbar-logo span { font-weight: 500; color: var(--text-3); }
@media (min-width: 600px) { .topbar-logo { font-size: 17px; } .topbar { padding: 10px 16px; } }
@media (min-width: 1025px) { .topbar-logo { font-size: 18px; } .topbar { padding: 12px 20px; } }

.mode-toggle {
  display: flex; background: var(--bg-muted);
  border: 1px solid var(--border-2); border-radius: var(--r); overflow: hidden; flex-shrink: 0;
}
.mode-btn {
  padding: 7px 12px; font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase;
  background: transparent; color: var(--text-3); cursor: pointer; transition: all 0.15s;
}
.mode-btn.active { background: var(--accent); color: #fff; }

.save-indicator {
  width: 7px; height: 7px; border-radius: 50%;
  opacity: 0; transition: opacity 0.3s; flex-shrink: 0;
}
.save-indicator.pending { background: var(--gold); opacity: 1; }
.save-indicator.saved   { background: var(--green); opacity: 1; }

.menu-btn {
  width: 38px; height: 38px; border-radius: var(--r);
  border: 1px solid var(--border-2); background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 4px; padding: 10px 7px;
  transition: background 0.15s; flex-shrink: 0;
}
.menu-btn span { width: 16px; height: 2px; background: var(--text); border-radius: 1px; transition: all 0.2s; }
.menu-btn.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.menu-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.menu-btn.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
.menu-btn:active { background: var(--bg-muted); }

.dropdown { position: relative; }
.dropdown-menu {
  position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--bg-card); border: 1px solid var(--border-2);
  border-radius: 10px; min-width: 170px; box-shadow: var(--shadow-lg);
  opacity: 0; visibility: hidden; transform: translateY(-8px) scale(0.97);
  transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 200; overflow: hidden;
}
.dropdown-menu.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.dropdown-item {
  display: flex; align-items: center; gap: 10px; padding: 13px 15px;
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.3px;
  color: var(--text); cursor: pointer; transition: background 0.1s;
  border-bottom: 1px solid var(--border);
}
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:active { background: var(--bg-muted); }
.dropdown-item .ic { font-size: 15px; width: 18px; text-align: center; }

/* ── CHAR NAME BAR ── */
.char-name-bar {
  background: var(--bg-raised); border-bottom: 1px solid var(--border);
  padding: 7px 12px; display: none; align-items: center; justify-content: center; gap: 10px;
}
.char-name-bar.show { display: flex; }
.char-name-input {
  font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600;
  color: var(--accent); background: transparent;
  border: none; border-bottom: 2px solid var(--border-2);
  text-align: center; padding: 4px 6px; min-width: 120px; max-width: 220px; outline: none;
}
.char-name-input:focus { border-color: var(--accent); }

/* ── CHAR BAR ── */
.char-bar {
  background: var(--bg-page); border-bottom: 1px solid var(--border);
  padding: 7px 12px; display: flex; align-items: center; gap: 6px;
  overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.char-bar::-webkit-scrollbar { display: none; }
.char-chip {
  flex-shrink: 0; padding: 6px 13px; border-radius: 20px;
  border: 2px solid var(--border-2); background: var(--bg-card);
  font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
  color: var(--text-2); cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.char-chip.active { border-color: var(--accent); color: var(--accent); }
.char-chip-del { opacity: 0.35; font-size: 13px; transition: opacity 0.1s; }
.char-chip:active .char-chip-del { opacity: 1; }
.char-chip-add {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px dashed var(--border-2); background: transparent;
  color: var(--text-3); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.char-chip-add:active { border-color: var(--accent); color: var(--accent); }

/* ── PAGES BAR ── */
.pages-bar {
  display: flex; background: var(--bg-card); border-bottom: 2px solid var(--border);
  padding: 0 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.pages-bar::-webkit-scrollbar { display: none; }
.page-tab {
  padding: 11px 14px; font-family: 'Cinzel', serif;
  font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase; font-weight: 600;
  color: var(--text-3); cursor: pointer; border: none; background: transparent;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  white-space: nowrap; transition: all 0.15s;
  display: flex; align-items: center; gap: 6px;
}
.page-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.page-tab .pdel { opacity: 0.3; font-size: 13px; }
.page-tab:active .pdel { opacity: 1; color: var(--red); }
.page-tab-add { color: var(--text-3); font-size: 20px; padding: 8px 12px; }
.page-name-inp {
  background: transparent; border: none; outline: none;
  font: inherit; color: inherit; text-align: center;
  padding: 0; min-width: 40px; max-width: 90px;
}

/* ── MAIN ── */
.main {
  padding: 8px; max-width: 800px; margin: 0 auto;
  padding-bottom: calc(var(--safe-b) + 80px);
}

/* ── PANEL ── */
.panel {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 8px; padding: var(--field-pad); margin-bottom: 10px;
  box-shadow: var(--shadow-sm); transition: box-shadow 0.2s;
  animation: panelIn 0.2s ease;
}
@keyframes panelIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.panel:hover { box-shadow: var(--shadow); }
.panel-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px; padding-bottom: 8px; border-bottom: 2px solid var(--border);
}
.panel-title {
  font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.6px; text-transform: uppercase; flex: 1;
}
.panel-title-input {
  font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.6px; text-transform: uppercase;
  background: transparent; border: none; border-bottom: 2px solid var(--border);
  outline: none; flex: 1; padding-bottom: 3px; color: var(--text);
}
.panel-title-input:focus { border-color: var(--accent); }
.panel-actions { display: flex; gap: 3px; }

/* ── BUTTONS ── */
.btn-icon {
  width: 30px; height: 30px; border-radius: 5px;
  border: 1px solid var(--border-2); background: var(--bg-raised);
  color: var(--text-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all 0.12s; -webkit-tap-highlight-color: transparent;
}
.btn-icon:active { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(0.94); }
.btn-icon.danger:active { background: var(--red); border-color: var(--red); }
.btn-icon.sm { width: 26px; height: 26px; font-size: 11px; }

.btn {
  font-family: 'Cinzel', serif; font-size: 9px; font-weight: 700;
  letter-spacing: 0.3px; text-transform: uppercase;
  padding: 0 14px; height: var(--btn-h); border-radius: var(--r);
  cursor: pointer; border: 2px solid var(--border-2);
  background: var(--bg-card); color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  transition: all 0.15s; white-space: nowrap; -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.96); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger  { background: transparent; color: var(--red); border-color: var(--red); }
.btn.ghost   { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:active { background: var(--bg-muted); border-color: var(--border-2); }
.btn.sm  { height: calc(var(--btn-h) - 6px);  padding: 0 10px; font-size: 8px; }
.btn.xs  { height: calc(var(--btn-h) - 10px); padding: 0 8px;  font-size: 7px; }

.color-dot {
  width: 26px; height: 26px; border-radius: 5px;
  border: 2px solid var(--border-2); cursor: pointer; flex-shrink: 0;
  transition: transform 0.12s; box-shadow: var(--shadow-sm);
}
.color-dot:active { transform: scale(0.9); }

/* ── FIELDS CONTAINER ── */
.fields-container { display: flex; flex-direction: column; gap: 2px; }

/* Row: gap natif — pas de marge négative qui fausse les % sur mobile */
.fields-row {
  display: flex; width: 100%; align-items: stretch;
  gap: var(--gap);
}
.fields-row.partial { justify-content: center; }

/* Field box — les % sont calculés sur la vraie largeur du conteneur */
.field-box {
  background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 5px; padding: var(--field-pad);
  display: flex; flex-direction: column; gap: 4px;
  transition: border-color 0.15s, box-shadow 0.15s;
  min-width: 0; container-type: inline-size;
}
/* Width system: on soustrait le gap total réparti entre les items.
   Formule : calc(X% - gap*(n-1)/n) — ici on utilise une approximation simple
   car le nombre d'items par ligne varie. On soustrait var(--gap) comme avant
   mais cette fois le conteneur n'est pas élargi par les marges négatives. */
.field-box[data-w="auto"] { flex: 1 1 0; }
.field-box[data-w="10"]   { flex: 0 0 calc(10%   - var(--gap)); max-width: calc(10%   - var(--gap)); }
.field-box[data-w="15"]   { flex: 0 0 calc(15%   - var(--gap)); max-width: calc(15%   - var(--gap)); }
.field-box[data-w="20"]   { flex: 0 0 calc(20%   - var(--gap)); max-width: calc(20%   - var(--gap)); }
.field-box[data-w="25"]   { flex: 0 0 calc(25%   - var(--gap)); max-width: calc(25%   - var(--gap)); }
.field-box[data-w="30"]   { flex: 0 0 calc(30%   - var(--gap)); max-width: calc(30%   - var(--gap)); }
.field-box[data-w="33"]   { flex: 0 0 calc(33.333% - var(--gap)); max-width: calc(33.333% - var(--gap)); }
.field-box[data-w="40"]   { flex: 0 0 calc(40%   - var(--gap)); max-width: calc(40%   - var(--gap)); }
.field-box[data-w="50"]   { flex: 0 0 calc(50%   - var(--gap)); max-width: calc(50%   - var(--gap)); }
.field-box[data-w="60"]   { flex: 0 0 calc(60%   - var(--gap)); max-width: calc(60%   - var(--gap)); }
.field-box[data-w="66"]   { flex: 0 0 calc(66.666% - var(--gap)); max-width: calc(66.666% - var(--gap)); }
.field-box[data-w="75"]   { flex: 0 0 calc(75%   - var(--gap)); max-width: calc(75%   - var(--gap)); }
.field-box[data-w="100"]  { flex: 0 0 100%; max-width: 100%; }

/* Drag states */
.field-box.dragging   { opacity: 0.4; border-style: dashed; }
.field-box.drag-over  { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.field-box.touch-drag { opacity: 0.4; transform: scale(0.97); border-style: dashed; }

/* Alignment */
.field-box[data-align="left"]   { align-items: flex-start; }
.field-box[data-align="center"] { align-items: center; }
.field-box[data-align="right"]  { align-items: flex-end; }
.field-box[data-align="left"]   .field-label,
.field-box[data-align="left"]   .field-label-inp { text-align: left; }
.field-box[data-align="center"] .field-label,
.field-box[data-align="center"] .field-label-inp { text-align: center; }
.field-box[data-align="right"]  .field-label,
.field-box[data-align="right"]  .field-label-inp { text-align: right; }

/* ── LABELS ── */
.field-label {
  font-family: 'Cinzel', serif; font-size: var(--fs-label); letter-spacing: 0.7px;
  text-transform: uppercase; color: var(--text-3); font-weight: 600; width: 100%;
}
.field-label-inp {
  font-family: 'Cinzel', serif; font-size: var(--fs-label); letter-spacing: 0.7px;
  text-transform: uppercase; background: transparent;
  border: none; border-bottom: 1px dashed var(--border-2); outline: none;
  padding-bottom: 2px; color: var(--text-2); width: 100%;
  font-weight: 600;
}
.field-label-inp:focus { border-color: var(--accent); border-style: solid; }

/* ── WIDGET: NUMBER ── */
.field-number { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
.num-val {
  font-family: 'Cinzel', serif; font-size: var(--fs-value); font-weight: 700;
  min-width: 44px; text-align: center; line-height: 1;
  padding: 4px 8px; cursor: pointer; border-radius: 5px;
  transition: background 0.12s;
}
.num-val:active { background: var(--bg-muted); }
.num-btns { display: flex; gap: 5px; }
.num-btn {
  width: var(--btn-h); height: var(--btn-h); border-radius: 5px;
  border: 2px solid var(--border-2); background: var(--bg-card);
  color: var(--text); font-size: 18px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.num-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(0.92); }

/* ── WIDGET: HEALTH ── */
.health-wrap { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.health-bar-outer {
  width: 100%; background: var(--bg-muted); border-radius: 999px;
  overflow: hidden; position: relative;
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
}
.health-bar-fill {
  height: 100%; border-radius: 999px;
  transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
.health-bar-fill::after {
  content: ''; position: absolute; inset: 0; border-radius: 999px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.25), transparent 60%);
  pointer-events: none;
}
.health-ctrl { display: flex; align-items: center; justify-content: center; gap: clamp(2px, 1cqw, 6px); }
.health-btn {
  width: clamp(18px, 5.6cqw, 32px); height: clamp(18px, 5.6cqw, 32px); border-radius: 999px;
  border: 2px solid var(--border-2); background: var(--bg-card);
  color: var(--text); font-size: clamp(10px, 4cqw, 20px); font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; box-shadow: var(--shadow-sm);
}
.health-btn.dmg:active  { background: var(--red);   color: #fff; border-color: var(--red);   transform: scale(0.90); }
.health-btn.heal:active { background: var(--green); color: #fff; border-color: var(--green); transform: scale(0.90); }
.health-curr {
  font-family: 'Cinzel', serif; font-size: clamp(14px, 5cqw, 24px); font-weight: 700;
  text-align: center; cursor: pointer;
  border-radius: 8px; padding: 3px 2px; transition: background 0.12s; line-height: 1;
}
.health-curr:active { background: var(--bg-muted); }
.health-max-lbl {
  font-family: 'Cinzel', serif; font-size: clamp(12px, 4cqw, 18px); font-weight: 600;
  color: var(--text-3); text-align: center;
}

/* ── WIDGET: DOTS / SQUARES ── */
.dots-row, .sq-row { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.dot, .sq {
  border: 2.5px solid; background: transparent;
  cursor: pointer; transition: all 0.1s;
  user-select: none; -webkit-user-select: none; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.dot { border-radius: 50%; }
.sq  { border-radius: 3px; }
.dot:active, .sq:active { transform: scale(1.2); }
.dot[data-sz="1"],.sq[data-sz="1"] { width:12px; height:12px; }
.dot[data-sz="2"],.sq[data-sz="2"] { width:16px; height:16px; }
.dot[data-sz="3"],.sq[data-sz="3"] { width:20px; height:20px; }
.dot[data-sz="4"],.sq[data-sz="4"] { width:26px; height:26px; }
.dot[data-sz="5"],.sq[data-sz="5"] { width:32px; height:32px; }

/* ── WIDGET: TEXT / TEXTAREA ── */
.f-text {
  width: 100%; background: var(--bg-input); border: 2px solid var(--border);
  border-radius: var(--r); padding: 8px 10px;
  font-family: 'Lora', serif; font-size: var(--fs-text); color: var(--text);
  outline: none; transition: border-color 0.15s;
}
.f-text:focus { border-color: var(--accent); }
.f-textarea {
  width: 100%; background: var(--bg-input); border: 2px solid var(--border);
  border-radius: var(--r); padding: 10px;
  font-family: 'Lora', serif; font-size: var(--fs-text); color: var(--text);
  outline: none; resize: vertical; min-height: 70px;
  transition: border-color 0.15s; line-height: 1.6;
}
.f-textarea:focus { border-color: var(--accent); }

/* ── WIDGET: STATUS ── */
.status-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.status-badge {
  display: inline-flex; align-items: center;
  padding: 8px 13px; border-radius: 6px; border: 2px solid;
  cursor: pointer; transition: all 0.15s;
  font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase;
  user-select: none; -webkit-user-select: none; white-space: nowrap; min-height: 36px;
  -webkit-tap-highlight-color: transparent;
}
.status-badge.inactive {
  background: var(--bg-card); border-color: var(--border-2);
  color: var(--text-2); box-shadow: var(--shadow-sm);
}
.status-badge.active { color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.status-badge:active { transform: scale(0.94); }

/* ── WIDGET: CHECKLIST ── */
.checklist-h, .checklist-v { display: flex; gap: 5px; flex-wrap: wrap; width: 100%; }
.checklist-v { flex-direction: column; }
.checklist-item {
  display: flex; align-items: center; gap: 7px; padding: 8px 11px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px;
  cursor: pointer; transition: all 0.1s;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.checklist-item:active { background: var(--bg-muted); }
.checklist-box {
  width: 18px; height: 18px; border-radius: 3px; border: 2px solid var(--border-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0; transition: all 0.12s; color: #fff;
}
.checklist-text { font-size: 12px; color: var(--text-2); line-height: 1.2; }
.checklist-text.done { font-weight: 700; }
.checklist-text.struck { font-weight: 700; text-decoration: line-through; opacity: 0.6; }

/* ── FIELD SETTINGS (edit mode) ── */
.field-settings {
  margin-top: 6px; padding: 6px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--r);
  display: none; flex-direction: column; gap: 4px;
  width: 100%; min-width: 0; overflow: hidden;
}
.field-settings.open { display: flex; }

.setting-row {
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0;
}
.setting-row label {
  font-family: 'Cinzel', serif; font-size: 8px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-3); min-width: 28px;
}
.setting-row input[type="number"],
.setting-row input[type="text"] {
  flex: 1; min-width: 0; width: 0; padding: 4px 6px;
  border: 1px solid var(--border-2); border-radius: 3px;
  font-size: 11px; background: var(--bg-input); color: var(--text); outline: none;
}
.setting-row input:focus { border-color: var(--accent); }

.mini-group {
  display: flex; gap: 1px; background: var(--bg-muted);
  border: 1px solid var(--border); border-radius: 3px; padding: 1px; flex-wrap: wrap; min-width: 0;
}
.mini-btn {
  min-width: 20px; height: 18px; border: none; background: transparent; color: var(--text-3);
  cursor: pointer; border-radius: 2px; padding: 0 3px;
  font-family: 'Cinzel', serif; font-size: 8px; font-weight: 700;
  transition: all 0.1s; text-transform: uppercase; -webkit-tap-highlight-color: transparent;
}
.mini-btn.on { background: var(--accent); color: #fff; }

.field-ctrl-row {
  display: flex; gap: 2px; padding-top: 4px; border-top: 1px solid var(--border); flex-wrap: wrap;
}

/* Settings toggle button (gear icon on field) */
.field-settings-toggle {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px; border-radius: 3px;
  border: none; background: transparent; color: var(--text-3);
  font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
  opacity: 0.5;
}
.field-settings-toggle:hover, .field-settings-toggle.open { opacity: 1; color: var(--accent); }

/* ── ADD BARS ── */
.add-field-bar {
  display: flex; gap: 3px; flex-wrap: wrap;
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-2);
}
.add-field-btn {
  padding: 5px 8px; border-radius: var(--r);
  border: 1px solid var(--border-2); background: transparent;
  color: var(--text-3); font-family: 'Cinzel', serif;
  font-size: 7px; font-weight: 700; letter-spacing: 0.3px;
  text-transform: uppercase; cursor: pointer; transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.add-field-btn:active { border-color: var(--accent); color: var(--accent); background: var(--bg-muted); }

.add-panel-wrap {
  border: 2px dashed var(--border-2); border-radius: 8px;
  padding: 14px; text-align: center; margin-bottom: 10px; cursor: pointer; transition: all 0.15s;
}
.add-panel-wrap:active { border-color: var(--accent); background: var(--bg-muted); }
.add-panel-btn {
  font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase; color: var(--text-3); border: none; background: none;
}

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 44px 20px; color: var(--text-3); }
.empty-state h2 {
  font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 0.5px;
  margin-bottom: 10px; color: var(--accent); font-weight: 700;
}
.empty-state p { font-style: italic; font-size: 13px; }

/* ── OVERLAY ── */
.overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.42); backdrop-filter: blur(2px);
  display: none; opacity: 0; transition: opacity 0.22s;
}
.overlay.show { display: block; opacity: 1; }

/* ── BOTTOM SHEETS ── */
.sheet {
  position: fixed; z-index: 160; bottom: 0; left: 0; right: 0;
  background: var(--bg-card); border-top: 1px solid var(--border-2);
  border-radius: 16px 16px 0 0;
  padding: 20px 18px calc(var(--safe-b) + 20px);
  max-height: 88dvh; overflow-y: auto; box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
  display: none; transform: translateY(20px);
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
.sheet::before {
  content: ''; display: block; width: 36px; height: 4px;
  background: var(--border-2); border-radius: 2px; margin: -8px auto 16px;
}
.sheet.show { display: block; transform: translateY(0); }
.sheet-title {
  font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700;
  color: var(--accent); text-align: center; margin-bottom: 14px;
}
.sheet-input {
  width: 100%; background: var(--bg-input); border: 2px solid var(--border-2);
  border-radius: var(--r); padding: 11px 13px;
  font-family: 'Lora', serif; font-size: 16px; color: var(--text);
  outline: none; margin-bottom: 14px;
}
.sheet-input:focus { border-color: var(--accent); }
.sheet-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.sheet-sub { font-size: 11px; color: var(--text-3); text-align: center; margin-bottom: 12px; font-style: italic; }

/* ── NUM MODAL (centré, pas bottom sheet) ── */
.num-modal {
  position: fixed; z-index: 160;
  top: 15%; left: 50%; transform: translateX(-50%);
  background: var(--bg-card); border: 1px solid var(--border-2);
  border-radius: 14px; padding: 22px 20px;
  width: min(92%, 340px); box-shadow: var(--shadow-lg);
  display: none;
  animation: modalIn 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes modalIn { from { opacity:0; transform:translateX(-50%) scale(0.93); } to { opacity:1; transform:translateX(-50%) scale(1); } }
.num-modal.show { display: block; }
.num-modal-title {
  font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
  color: var(--accent); text-align: center; margin-bottom: 10px;
}
.num-modal-preview {
  font-family: 'Cinzel', serif; font-size: 48px; font-weight: 700;
  text-align: center; padding: 6px 0; letter-spacing: 1px;
  min-height: 64px; line-height: 1; transition: color 0.2s;
}
.num-modal-modes {
  display: flex; gap: 5px; margin-bottom: 12px;
}
.num-mode-btn {
  flex: 1; height: 38px; border-radius: var(--r);
  border: 2px solid var(--border-2); background: var(--bg-raised);
  color: var(--text-2); font-family: 'Cinzel', serif;
  font-size: 9px; font-weight: 700; cursor: pointer; transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.num-mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.num-modal-input {
  width: 100%; background: var(--bg-input); border: 2px solid var(--border-2);
  border-radius: var(--r); padding: 14px;
  font-family: 'Cinzel', serif; font-size: 26px; font-weight: 700;
  text-align: center; color: var(--text); outline: none; margin-bottom: 14px;
  -moz-appearance: textfield;
}
.num-modal-input:focus { border-color: var(--accent); }
.num-modal-input::-webkit-inner-spin-button,
.num-modal-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ── SAVE LIST ── */
.save-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 12px; background: var(--bg-raised); border: 1px solid var(--border);
  border-radius: 6px; margin-bottom: 6px; gap: 8px;
}
.save-item.sel { border-color: var(--accent); background: var(--bg-card); }
.save-item-info { flex: 1; cursor: pointer; }
.save-item-name { font-family: 'Cinzel', serif; font-size: 12px; font-weight: 600; }
.save-item-date { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.save-item-actions { display: flex; gap: 4px; }

/* ── COLOR GRID ── */
.color-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; padding: 4px; }
@media (max-width: 360px) { .color-grid { grid-template-columns: repeat(6, 1fr); } }
.color-swatch {
  aspect-ratio: 1; border-radius: 5px; cursor: pointer;
  border: 2px solid transparent; transition: all 0.1s;
}
.color-swatch:active { transform: scale(1.15); }
.color-swatch.active { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg-card); }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: calc(var(--safe-b) + 20px); left: 50%;
  transform: translateX(-50%);
  background: var(--accent); color: #fff;
  font-family: 'Cinzel', serif; font-size: 10px; font-weight: 700;
  letter-spacing: 0.4px; padding: 10px 22px; border-radius: 20px;
  opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 300;
  box-shadow: var(--shadow); white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ── PWA ── */
.pwa-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg-card); border-top: 2px solid var(--border);
  padding: 12px 14px calc(var(--safe-b) + 12px);
  display: none; align-items: center; gap: 12px; z-index: 120;
}
.pwa-bar.show { display: flex; }
.pwa-bar-text { flex: 1; font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600; }

/* Bouton install dans la topbar */
.install-btn {

  letter-spacing: 0.3px; text-transform: uppercase;

  flex-shrink: 0;
}
.install-btn.show { display: flex; }
.install-btn:active { background: var(--gold); color: #fff; transform: scale(0.95); }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
</style>

let _numTarget = null, _numMode = 'set';

function setNumMode(m) {
  _numMode = m;
  ['set','add','sub'].forEach(k => {
    const el = $('numMode' + k.charAt(0).toUpperCase() + k.slice(1));
    if (el) el.classList.toggle('active', k === m);
  });
  if (_numTarget && _numTarget.isMax) updateNumPreviewMax();
  else updateNumPreview();
}
function updateNumPreview() {
  if (!_numTarget) return;
  const {pi, fi, isHealth} = _numTarget;
  const f = curPage().panels[pi].fields[fi];
  const cur = f.value || 0;
  const raw = parseInt($('numInput').value, 10);
  const mn  = isHealth ? 0 : (f.min ?? 0);
  const mx  = isHealth ? (f.max||10) : (f.max ?? 99);
  let next = cur;
  if (!isNaN(raw)) {
    if (_numMode === 'set')      next = clamp(raw, mn, mx);
    else if (_numMode === 'add') next = clamp(cur + raw, mn, mx);
    else                         next = clamp(cur - raw, mn, mx);
  }
  $('numPreview').textContent = next;
  $('numPreview').style.color = next > cur ? 'var(--green)' : (next < cur ? 'var(--red)' : 'var(--accent)');
}
function openNumModal(pi, fi, isHealth=false, label='') {
  _numTarget = {pi, fi, isHealth}; _numMode = 'set';
  $('numModalTitle').textContent = label || 'Modifier';
  ['numModeSet','numModeAdd','numModeSub'].forEach(id => { const el=$(id); if(el) el.classList.remove('active'); });
  $('numModeSet').classList.add('active');
  const inp = $('numInput'); inp.value = '';
  const f = curPage().panels[pi].fields[fi];
  $('numPreview').textContent = f.value ?? 0;
  $('numPreview').style.color = 'var(--accent)';
  inp.addEventListener('input', updateNumPreview);
  $('ovNum').classList.add('show'); $('numModal').classList.add('show');
  setTimeout(() => inp.focus(), 80);
}
function closeNumModal() {
  $('numInput').removeEventListener('input', updateNumPreview);
  $('numInput').removeEventListener('input', updateNumPreviewMax);
  $('ovNum').classList.remove('show'); $('numModal').classList.remove('show');
  _numTarget = null;
}
function applyNumChange() {
  if (!_numTarget) return;
  const {pi, fi, isHealth, isMax} = _numTarget;
  const raw = parseInt($('numInput').value, 10);
  const f = curPage().panels[pi].fields[fi];
  if (isMax) {
    // Editing the max value
    if (!isNaN(raw) && raw >= 1) {
      let next;
      if (_numMode === 'set')      next = Math.max(1, raw);
      else if (_numMode === 'add') next = Math.max(1, (f.max||10) + raw);
      else                         next = Math.max(1, (f.max||10) - raw);
      f.max = next;
      if (f.value > f.max) f.value = f.max;
      renderMain(); schedSave();
    }
    closeNumModal(); return;
  }
  const mn = isHealth ? 0 : (f.min ?? 0);
  const mx = isHealth ? (f.max||10) : (f.max ?? 99);
  if (!isNaN(raw)) {
    let next;
    if (_numMode === 'set')      next = clamp(raw, mn, mx);
    else if (_numMode === 'add') next = clamp((f.value||0) + raw, mn, mx);
    else                         next = clamp((f.value||0) - raw, mn, mx);
    f.value = next; renderMain(); schedSave();
  }
  closeNumModal();
}

  const r = new FileReader();
  r.onload = ev => {
    try {
      const imp = JSON.parse(ev.target.result); if (!imp.characters) throw new Error();

/* ══════════════════════════════════════
   LINE GROUPING
   FIX: use index from parent fields array, not indexOf on sub-array
══════════════════════════════════════ */
function groupFieldsByLine(fields) {
  const lines = [];
  let curLine = [], curW = 0;

  fields.forEach((f, globalIdx) => {
    const w = f.width === 'auto' ? 20 : (parseInt(f.width) || 20);

    // Force new line before this field
    if (f.newLine && curLine.length > 0) {
      lines.push({ items: curLine, totalW: curW });
      curLine = []; curW = 0;
    }
    // Overflow: start new line
    if (curLine.length > 0 && curW + w > 100) {
      lines.push({ items: curLine, totalW: curW });
      curLine = []; curW = 0;
    }

    curLine.push({ f, globalIdx }); // FIX: store globalIdx alongside field
    curW += w;

    // Full line
    if (curW >= 100) {
      lines.push({ items: curLine, totalW: curW });
      curLine = []; curW = 0;
    }
  });

  if (curLine.length > 0) lines.push({ items: curLine, totalW: curW });
  return lines;
}

/* ══════════════════════════════════════
   DRAG & DROP (mouse + touch)
   FIX: el.dataset.fi now holds the correct global index thanks to renderField fix
══════════════════════════════════════ */
function setupDragAndDrop() {
  let drag = null;

  document.querySelectorAll('.field-box[draggable="true"]').forEach(el => {
    /* Mouse */
    el.addEventListener('dragstart', e => {
      drag = { pi: +el.dataset.pi, fi: +el.dataset.fi };
      el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
      drag = null;
    });
    el.addEventListener('dragover',  e => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); el.classList.remove('drag-over'); if (!drag) return;
      const dpi=+el.dataset.pi, dfi=+el.dataset.fi;
      if (drag.pi===dpi && drag.fi===dfi) return;
      const sf=curPage().panels[drag.pi].fields, df=curPage().panels[dpi].fields;
      const [item]=sf.splice(drag.fi,1); df.splice(dfi,0,item);
      renderAll(); schedSave(); drag=null;
    });

    /* Touch (long press) */
    let longPress=null, touchDrag=false;
    el.addEventListener('touchstart', e => {
      touchDrag=false;
      longPress=setTimeout(() => {
        touchDrag=true; drag={pi:+el.dataset.pi,fi:+el.dataset.fi};
        el.classList.add('touch-drag'); navigator.vibrate?.(20);
      }, 400);
    }, {passive:true});
    el.addEventListener('touchmove', e => {
      clearTimeout(longPress); if (!touchDrag) return;
      const t=e.touches[0], under=document.elementFromPoint(t.clientX,t.clientY);
      const tgt=under?.closest('.field-box[draggable="true"]');
      document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
      if (tgt&&tgt!==el) tgt.classList.add('drag-over');
    }, {passive:true});
    el.addEventListener('touchend', e => {
      clearTimeout(longPress);
      if (!touchDrag||!drag) { touchDrag=false; return; }
      const t=e.changedTouches[0], under=document.elementFromPoint(t.clientX,t.clientY);
      const tgt=under?.closest('.field-box[draggable="true"]');
      el.classList.remove('touch-drag');
      document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
      if (tgt&&tgt!==el) {
        const dpi=+tgt.dataset.pi, dfi=+tgt.dataset.fi;
        const sf=curPage().panels[drag.pi].fields, df=curPage().panels[dpi].fields;
        const [item]=sf.splice(drag.fi,1); df.splice(dfi,0,item);
        renderAll(); schedSave();
      }
      drag=null; touchDrag=false;
    });
  });
}

/* ══════════════════════════════════════
   SWIPE NAVIGATION
══════════════════════════════════════ */
(function(){
  let sx=null;
  const m=$('mainContent');
  m.addEventListener('touchstart', e=>{sx=e.touches[0].clientX;},{passive:true});
  m.addEventListener('touchend', e=>{
    if(sx===null) return;
    const dx=e.changedTouches[0].clientX-sx; sx=null;
    if(Math.abs(dx)<100) return;
    const pages=curChar().pages;
    if(dx<0 && S.pageIdx<pages.length-1) selectPage(S.pageIdx+1);
    else if(dx>0 && S.pageIdx>0) selectPage(S.pageIdx-1);
  });
})();

/* ══════════════════════════════════════
   PWA
══════════════════════════════════════ */
/* ══════════════════════════════════════
   PWA — Installation
══════════════════════════════════════ */
let deferredPrompt = null;

function showInstallBtn() {
  // Afficher bouton topbar
  const btn = $('installBtn');
  if (btn) btn.classList.add('show');
  // Afficher aussi la barre basse si pas déjà dismissed
  if (!sessionStorage.getItem('pwa_dismissed')) {
    $('pwaBar').classList.add('show');
  }
}

function hideInstallUI() {
  const btn = $('installBtn');
  if (btn) btn.classList.remove('show');
  $('pwaBar').classList.remove('show');
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Ne pas montrer si déjà installé
  if (!window.matchMedia('(display-mode: standalone)').matches) {
    showInstallBtn();
  }
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(r => {
      if (r.outcome === 'accepted') showToast('✅ Mat\'s Forge installé !');
      deferredPrompt = null;
      hideInstallUI();
    });
  } else {
    // Fallback: instructions manuelles selon le navigateur
    const ua = navigator.userAgent;
    if (/iPhone|iPad/.test(ua)) {
      showToast('Sur iOS : bouton Partager → "Sur l\'écran d\'accueil"');
    } else {
      showToast('Ouvrez le menu ⋮ du navigateur → "Installer l\'application"');
    }
  }
}

function dismissPWA() {
  $('pwaBar').classList.remove('show');
  sessionStorage.setItem('pwa_dismissed', '1');
  // Le bouton topbar reste visible
}

window.addEventListener('appinstalled', () => {
  showToast("✅ Mat's Forge installé !");
  hideInstallUI();
  deferredPrompt = null;
});

// Cacher si déjà en mode standalone (installé)
if (window.matchMedia('(display-mode: standalone)').matches) {
  hideInstallUI();
}

/* ── Service Worker ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // SW externe — requis pour Android/iOS (les blob: URL ne persistent pas entre sessions)
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => {
        console.log('[PWA] Service Worker enregistré, scope:', reg.scope);
      })
      .catch(err => {
        console.warn('[PWA] Service Worker non enregistré:', err);
      });
  });
}

/* ══════════════════════════════════════
   KEYBOARD SHORTCUTS
══════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key==='Enter' && $('numModal').classList.contains('show')) { e.preventDefault(); applyNumChange(); }
  if (e.key==='Escape') {
    [['ovSave','sheetSave',closeSaveSheet],['ovLoad','sheetLoad',closeLoadSheet],
     ['ovNum','numModal',closeNumModal],['ovColor','sheetColor',closeColorPicker],
     ['ovConfirm','sheetConfirm',closeConfirmSheet]
    ].forEach(([ov,sh,fn])=>{ if($(sh).classList.contains('show')) fn(); });
  }
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
loadFromStorage();
applyTheme();
applyMode();   /* FIX: apply saved mode (not always force play) */
renderAll();
</script>
